version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: fedha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fedha
      POSTGRES_PASSWORD: fedha
      POSTGRES_DB: fedha
    ports:
      - "5432:5432"
    volumes:
      - fedha-postgres-data:/var/lib/postgresql/data

volumes:
  fedha-postgres-data:
